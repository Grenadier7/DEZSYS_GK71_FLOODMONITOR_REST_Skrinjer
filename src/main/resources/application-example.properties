# ===========================================================================
# Konfigurationsbeispiel - vollstaendige Liste aller Schalter
# ===========================================================================
#
# Diese Datei ist eine Vorlage und wird von der Anwendung NICHT gelesen. Sie
# zeigt jeden verfuegbaren Schluessel mit seinem Standardwert und erklaert,
# was er bewirkt. Zum Benutzen: Inhalt nach application.properties kopieren
# und anpassen.
#
# GEHEIME ZUGANGSDATEN: Diese Anwendung hat keine. Es gibt keine Datenbank,
# keinen externen Dienst, keine API-Schluessel und keine Authentifizierung -
# alle Daten entstehen im Arbeitsspeicher durch den eingebauten Simulator.
# Deshalb ist application.properties unbedenklich im Git-Repository.
# Kaeme spaeter ein Passwort dazu, gehoerte es NICHT hierher, sondern in eine
# Umgebungsvariable oder eine nicht versionierte Datei.
#
# Alle Werte hier sind die Standardwerte. Ein auskommentierter Eintrag
# verhaelt sich genauso wie der eingetragene Standard.
# ===========================================================================


# ---------------------------------------------------------------------------
# Server
# ---------------------------------------------------------------------------

# Port, auf dem die Anwendung lauscht. Der Webclient liegt danach unter
# http://localhost:<port>/ , die API unter http://localhost:<port>/api/v1
server.port=8080


# ---------------------------------------------------------------------------
# Simulation - Steuerung
# ---------------------------------------------------------------------------
# Diese zwei Werte liest keine Bean, sondern eine Annotation:
#   interval -> @Scheduled(fixedRateString = ...) im SimulationService
#   enabled  -> @ConditionalOnProperty am SimulationService

# Abstand zwischen zwei Simulationsschritten in Millisekunden.
# Kleiner = schneller waechst die Historie. Achtung: das Intervall aendert nur
# die Geschwindigkeit, nicht das Verhalten - ein Schritt bleibt ein Schritt.
simulation.interval=10000

# false legt die Simulator-Bean gar nicht erst an. Es entstehen dann keine
# neuen Messwerte. Genau das nutzen die automatisierten Tests
# (siehe src/test/resources/application.properties).
simulation.enabled=true


# ---------------------------------------------------------------------------
# Simulation - Modellparameter
# ---------------------------------------------------------------------------
# Gebunden an das Record SimulationProperties im Paket config.
# Aenderungen wirken nach einem Neustart, ohne Eingriff in den Java-Code.

# Anteil der Differenz zum Normalpegel, der pro Schritt ausgeglichen wird.
# 0 = der Pegel kehrt nie zur Norm zurueck, 1 = er springt sofort dorthin.
#
# WICHTIG: mean-reversion und rain-to-level muessen zueinander passen. Der
# Regen hebt den Pegel um rain-to-level * Niederschlag, der Ruecklauf zieht ihn
# um mean-reversion * (Normalpegel - Pegel) zurueck. Das Gleichgewicht liegt
# dort, wo sich beides aufhebt. Ist mean-reversion zu klein, laeuft der Pegel
# davon und jede Station steht dauerhaft auf CRITICAL.
simulation.mean-reversion=0.25

# Pegelanstieg in cm je mm/h Niederschlag.
simulation.rain-to-level=1.8

# Standardabweichung des Rauschens auf dem Pegel in cm. 0 = vollkommen glatt.
simulation.level-noise-sd=1.5

# Wahrscheinlichkeit eines Regenschauers je Schritt (0 bis 1).
simulation.shower-chance=0.08

# Maximale zusaetzliche Regenmenge eines Schauers in mm/h.
simulation.shower-intensity=12.0

# Akkustand in Prozent, ab dem die Station auf MAINTENANCE wechselt.
simulation.maintenance-battery=15

# Akkustand der allerersten Messung einer Station in Prozent.
simulation.start-battery=100

# Wahrscheinlichkeit je Schritt, dass der Akku um 1 Prozent sinkt.
# 0.05 bedeutet etwa jeder 20. Schritt.
simulation.battery-drain-chance=0.05

# Wahrscheinlichkeit je Schritt, dass eine Station in MAINTENANCE endgueltig
# auf OFFLINE faellt. Danach erzeugt der Simulator fuer sie keine Werte mehr.
simulation.offline-chance=0.1


# ---------------------------------------------------------------------------
# Fachliche Regeln
# ---------------------------------------------------------------------------

# Ab diesem Alter gilt eine Messung nicht mehr als aktuell; ihre Warnstufe
# wird nach aussen zu UNKNOWN (Angabe Punkt 3: "keine aktuelle oder gueltige
# Messung"). Der in der Messung gespeicherte Wert bleibt davon unberuehrt.
#
# ISO-8601-Dauer: PT30S = 30 Sekunden, PT5M = 5 Minuten, PT2H = 2 Stunden.
# Sinnvoll ist ein Vielfaches von simulation.interval.
floodmonitor.measurement-max-age=PT5M


# ---------------------------------------------------------------------------
# Serialisierung und Fehlerausgabe
# ---------------------------------------------------------------------------

# Zeitstempel als ISO-8601-Text (2026-05-01T10:15:00Z) statt als Zahl.
# Ohne diese Zeile serialisiert Jackson einen Instant als Epoch-Sekunden.
spring.jackson.datatype.datetime.write-dates-as-timestamps=false

# Keine Stacktraces nach aussen - Vorgabe aus Punkt 6 der Angabe.
spring.web.error.include-stacktrace=never
spring.web.error.include-message=always


# ---------------------------------------------------------------------------
# OpenAPI / Swagger
# ---------------------------------------------------------------------------
# Standardpfade von springdoc, hier nur zur Dokumentation aufgefuehrt.
# springdoc.api-docs.path=/v3/api-docs
# springdoc.swagger-ui.path=/swagger-ui.html
#
# Fuer eine Abgabe ohne interaktive Oberflaeche:
# springdoc.swagger-ui.enabled=false


# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------

# DEBUG zeigt jedes eingehende Mapping - hilfreich beim Entwickeln, im
# Dauerbetrieb sehr gespraechig. Fuer eine Vorfuehrung besser auf WARN.
logging.level.org.springframework.web=DEBUG

# Jeder Simulationsschritt protokolliert, wie viele Messwerte entstanden sind.
# logging.level.at.tgm.dezsys.floodmonitor.service.SimulationService=DEBUG
