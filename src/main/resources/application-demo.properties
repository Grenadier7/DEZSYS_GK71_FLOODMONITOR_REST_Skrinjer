# ===========================================================================
# Profil "demo" - fuer die Vorfuehrung beim Abgabegespraech
# ===========================================================================
#
# Starten mit:
#   ./gradlew bootRun --args="--spring.profiles.active=demo"
#
# Ein Spring-Profil ueberlagert nur die hier genannten Schluessel; alles
# uebrige kommt weiter aus application.properties.
#
# Zweck: die Zustaende, auf die es bei der Abnahme ankommt, treten im
# Normalbetrieb selten auf. Bei 10 Sekunden Intervall und 5 Prozent
# Entladewahrscheinlichkeit braeuchte eine Station rund fuenf Stunden bis
# MAINTENANCE. Dieses Profil beschleunigt genau das - ohne eine einzige
# Zeile Java zu aendern.
# ===========================================================================

# Zwei Schritte pro Sekunde: die Historie fuellt sich sichtbar, der Webclient
# zeigt bei jeder Aktualisierung neue Werte.
simulation.interval=500

# Deutlich staerkerer Regeneinfluss. Zusammen mit der unveraenderten
# mean-reversion von 0.25 erreichen die Stationen regelmaessig WARNING und
# immer wieder auch CRITICAL - damit ist /api/v1/alerts nie leer und die
# Farbcodierung im Webclient sofort sichtbar.
simulation.rain-to-level=5.0

# Der Akku bleibt bewusst bei den Standardwerten. Ein schnell leerlaufender
# Akku wuerde alle Stationen binnen Sekunden auf OFFLINE schicken - danach
# erzeugt der Simulator keine Messwerte mehr und es gibt nichts mehr zu zeigen.
#
# Fuer die Vorfuehrung des Weges ONLINE -> MAINTENANCE -> OFFLINE deshalb ein
# eigener Start mit zusaetzlichen Argumenten, nicht ueber dieses Profil:
#
#   ./gradlew bootRun --args="--spring.profiles.active=demo \
#       --simulation.start-battery=20 \
#       --simulation.battery-drain-chance=1.0 \
#       --simulation.offline-chance=0.15"
#
# Dann sind nach etwa zehn Sekunden alle Stationen OFFLINE, ihre Warnstufe
# steht auf UNKNOWN und die Messwerterzeugung ist gestoppt.

# Ruhiges Protokoll waehrend der Vorfuehrung.
logging.level.org.springframework.web=WARN
