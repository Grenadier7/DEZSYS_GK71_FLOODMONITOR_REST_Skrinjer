server.port=8080

# ---------------------------------------------------------------------------
# Simulation
# ---------------------------------------------------------------------------
# Diese beiden Werte liest keine Bean, sondern eine Annotation:
#   interval -> @Scheduled(fixedRateString = ...) im SimulationService
#   enabled  -> @ConditionalOnProperty am SimulationService
# Bei enabled=false wird die Bean nicht angelegt, es entstehen keine neuen
# Messwerte. Genau das brauchen die automatisierten Tests.
simulation.interval=10000
simulation.enabled=true

# Ab hier: gebunden an das Record SimulationProperties (config-Package).
# Aenderungen wirken nach einem Neustart, ohne Eingriff in den Java-Code.

# Anteil der Differenz zum Normalpegel, der pro Schritt ausgeglichen wird.
# Groesser = Pegel kehrt schneller zur Norm zurueck, Hochwasser klingt schneller ab.
#
# Dieser Wert und rain-to-level muessen zueinander passen, sonst laeuft der Pegel
# davon: der Regen hebt ihn um rain-to-level * Niederschlag, der Ruecklauf zieht
# ihn um mean-reversion * (Normalpegel - Pegel) zurueck. Das Gleichgewicht liegt
# dort, wo sich beides aufhebt. Mit 0.05/1.8 lag es bei etwa 420 cm - also
# dauerhaft ueber dem kritischen Wert jeder Station.
# Mit 0.25/1.8 verteilen sich die Warnstufen auf etwa 75 % NORMAL, 24 % WARNING
# und 1 % CRITICAL.
simulation.mean-reversion=0.25

# Pegelanstieg in cm je mm/h Niederschlag. Der Haupthebel, wenn Sie schneller
# eine WARNING oder CRITICAL sehen wollen (z. B. 4.0 statt 1.8) - dann aber
# mean-reversion mit anheben, siehe oben.
simulation.rain-to-level=1.8

# Standardabweichung des Rauschens auf dem Pegel in cm. 0 = vollkommen glatt.
simulation.level-noise-sd=1.5

# Wahrscheinlichkeit eines Regenschauers je Schritt (0 bis 1) und seine
# maximale zusaetzliche Regenmenge in mm/h.
simulation.shower-chance=0.08
simulation.shower-intensity=12.0

# Akkustand in Prozent, ab dem die Station auf MAINTENANCE wechselt.
simulation.maintenance-battery=15

# Akkustand der ersten Messung einer Station und Wahrscheinlichkeit je Schritt,
# dass er um 1 % sinkt. Mit start-battery=18 und drain-chance=1.0 erreicht eine
# Station MAINTENANCE in wenigen Schritten - praktisch fuer eine Vorfuehrung.
simulation.start-battery=100
simulation.battery-drain-chance=0.05

# Wahrscheinlichkeit je Schritt, dass eine Station in MAINTENANCE endgueltig
# auf OFFLINE faellt. Ab dann erzeugt der Simulator fuer sie keine Werte mehr.
simulation.offline-chance=0.1

# ---------------------------------------------------------------------------
# Fachliche Regeln
# ---------------------------------------------------------------------------
# Ab diesem Alter gilt eine Messung nicht mehr als aktuell, ihre Warnstufe wird
# zu UNKNOWN (Angabe Punkt 3: "keine aktuelle oder gueltige Messung").
# ISO-8601-Dauer: PT30S = 30 Sekunden, PT5M = 5 Minuten, PT2H = 2 Stunden.
# Sinnvoll ist ein Vielfaches von simulation.interval.
floodmonitor.measurement-max-age=PT5M

# ---------------------------------------------------------------------------
# Serialisierung und Fehlerausgabe
# ---------------------------------------------------------------------------
# Zeitstempel als ISO-8601-Text (2026-05-01T10:15:00Z) statt als Zahl.
spring.jackson.datatype.datetime.write-dates-as-timestamps=false

# Keine Stacktraces nach aussen - Vorgabe aus Punkt 6 der Angabe.
spring.web.error.include-stacktrace=never
spring.web.error.include-message=always

logging.level.org.springframework.web=DEBUG
