# Konfiguration fuer automatisierte Tests (Angabe Punkt 9).
#
# Diese Datei ueberlagert src/main/resources/application.properties, sobald
# Tests laufen - Spring Boot liest beide, und der Classpath des Tests gewinnt.

# Der wichtigste Schalter: ohne ihn wuerde der Simulator waehrend der Tests
# weiterlaufen und staendig neue Messwerte erzeugen. Ein Test, der "genau 3
# Messwerte" erwartet, waere dann mal gruen und mal rot - die Angabe verlangt
# ausdruecklich, dass Tests nicht zufaellig fehlschlagen.
#
# Technisch greift @ConditionalOnProperty am SimulationService: die Bean wird
# bei false gar nicht erst angelegt. Die Testdaten setzt stattdessen jeder
# Test selbst ueber das MeasurementRepository.
simulation.enabled=false

# Grosszuegig, damit selbst gesetzte Testdaten nie als "veraltet" gelten und
# unerwartet zu UNKNOWN werden.
floodmonitor.measurement-max-age=PT24H

# Kein DEBUG-Rauschen im Testprotokoll.
logging.level.org.springframework.web=WARN
